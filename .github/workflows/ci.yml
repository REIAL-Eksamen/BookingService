name: BookingService CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore BookingService.slnx

      - name: Build solution
        run: dotnet build BookingService.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test BookingService.slnx --configuration Release --no-build